map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Angular/Vite uses the origin root for HMR even when the admin base href is /admin/.
# Only its WebSocket subprotocol bypasses the ordinary root redirect.
map "$http_upgrade:$http_sec_websocket_protocol" $admin_dev_socket {
  default 0;
  ~*^websocket:vite-hmr$ 1;
}

map $uri $auth_loggable {
  default 1;
  ~^/api/auth(?:/|$) 0;
}

server {
  access_log /var/log/nginx/access.log combined if=$auth_loggable;
  listen 80;
  server_name _;
  proxy_hide_header Cache-Control;
  proxy_hide_header Expires;
  proxy_set_header If-None-Match "";
  proxy_set_header If-Modified-Since "";
  etag off;
  add_header Cache-Control "no-store" always;
  client_max_body_size 20m;

  location = / {
    access_log off; # Development socket URLs carry a Vite handshake token.
    if ($admin_dev_socket = 0) { return 302 $scheme://$http_host/admin/; }
    proxy_pass http://web-admin:4200;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }

  # Exact development-client resources injected by Angular/Vite. No generic filesystem proxy.
  location = /@vite/client {
    proxy_pass http://web-admin:4200;
    proxy_set_header Host $http_host;
  }
  location = /@fs/app/node_modules/vite/dist/client/env.mjs {
    proxy_pass http://web-admin:4200;
    proxy_set_header Host $http_host;
  }

  location = /admin {
    return 308 /admin/;
  }

  # Entry point dell'app: mai in cache, cosi un deploy viene visto subito.
  location = /admin/ {
    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache";
    add_header Clear-Site-Data '"cache"' always;
    proxy_pass http://web-admin:4200/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location = /admin/index.html {
    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache";
    add_header Clear-Site-Data '"cache"' always;
    proxy_pass http://web-admin:4200/index.html;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Worker for install/push only: no fetch handler, caching or offline fallback.
  location = /admin/service-worker.js {
    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache";
    proxy_pass http://web-admin:4200/service-worker.js;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /admin/manifest.webmanifest {
    add_header Cache-Control "no-store" always;
    proxy_pass http://web-admin:4200/manifest.webmanifest;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /admin/ {
    proxy_pass http://web-admin:4200/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location = /booking {
    return 308 /booking/;
  }

  location /booking/ {
    proxy_pass http://web-public-booking:4201/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # A single authoritative catalog, including the registered admin installation path.
  location = /.well-known/eulab-connect.json {
    proxy_pass http://api:3000/.well-known/eulab-connect.json;
    proxy_set_header Host $http_host;
  }
  location = /admin/.well-known/eulab-connect.json {
    proxy_pass http://api:3000/.well-known/eulab-connect.json;
    proxy_set_header Host $http_host;
  }

  location = /api {
    return 308 /api/;
  }

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
