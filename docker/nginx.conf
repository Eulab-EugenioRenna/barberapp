map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $uri $auth_loggable {
  default 1;
  ~^/api/auth(?:/|$) 0;
}

# Docker DNS refreshes upstreams when compiled application containers are recreated.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream admin_app {
  zone admin_app 64k;
  server web-admin:80 resolve;
}
upstream booking_app {
  zone booking_app 64k;
  server web-public-booking:80 resolve;
}
upstream api_app {
  zone api_app 64k;
  server api:3000 resolve;
}

server {
  access_log /var/log/nginx/access.log combined if=$auth_loggable;
  listen 80;
  server_name _;
  proxy_hide_header Cache-Control;
  proxy_hide_header Expires;
  proxy_set_header If-None-Match "";
  proxy_set_header If-Modified-Since "";
  etag off;
  add_header Cache-Control "no-store" always;
  client_max_body_size 20m;

  location = / {
    return 302 $scheme://$http_host/admin/;
  }

  location = /admin {
    return 308 /admin/;
  }

  # Entry point dell'app: mai in cache, cosi un deploy viene visto subito.
  location = /admin/ {
    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache";
    add_header Clear-Site-Data '"cache"' always;
    proxy_pass http://admin_app/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location = /admin/index.html {
    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache";
    add_header Clear-Site-Data '"cache"' always;
    proxy_pass http://admin_app/index.html;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Worker for install/push only: no fetch handler, caching or offline fallback.
  location = /admin/service-worker.js {
    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache";
    proxy_pass http://admin_app/service-worker.js;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /admin/manifest.webmanifest {
    add_header Cache-Control "no-store" always;
    proxy_pass http://admin_app/manifest.webmanifest;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /admin/ {
    proxy_pass http://admin_app/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location = /booking {
    return 308 /booking/;
  }

  location /booking/ {
    proxy_pass http://booking_app/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # A single authoritative catalog, including the registered admin installation path.
  # Conventional installation entry point for EULab Admin access-as tickets.
  # The API keeps its JSON routes under /api; this exact path is browser-facing.
  location = /eulab/connect/technical {
    add_header Cache-Control "no-store" always;
    proxy_pass http://api_app/eulab/connect/technical;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /.well-known/eulab-connect.json {
    proxy_pass http://api_app/.well-known/eulab-connect.json;
    proxy_set_header Host $http_host;
  }
  location = /admin/.well-known/eulab-connect.json {
    proxy_pass http://api_app/.well-known/eulab-connect.json;
    proxy_set_header Host $http_host;
  }

  location = /api {
    return 308 /api/;
  }

  location /api/ {
    proxy_pass http://api_app/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
