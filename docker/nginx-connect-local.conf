# Backend-only TLS termination for the local Connect API; no new auth protocol.
server {
  listen 443 ssl;
  server_name nginx;
  ssl_certificate /etc/nginx/connect-local/tls.crt;
  ssl_certificate_key /etc/nginx/connect-local/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  access_log off;
  client_max_body_size 1m;
  resolver 127.0.0.11 valid=10s;
  location /v1/ {
    set $connect_api http://eulab-connect-api-1:3000;
    proxy_pass $connect_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 15s;
  }
  # Canonical issuer remains localhost:8080 in the browser; backend calls use this TLS transport.
  location /realms/ {
    set $keycloak_api http://eulab-connect-keycloak-1:8080;
    proxy_pass $keycloak_api;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:8080;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 15s;
  }
  location / { return 404; }
}
