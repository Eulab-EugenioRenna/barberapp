server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

  # PWA is installation-only: never keep application responses in HTTP cache.
  add_header Cache-Control "no-store" always;

  # Missing bundles must return 404 rather than the HTML shell after a deploy.
  location ~* \.(?:js|mjs|css|map|json|webmanifest|png|jpe?g|svg|ico|webp|woff2?|ttf)$ {
    try_files $uri =404;
  }

  # Supports direct navigation to booking/<tenant-slug>.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
