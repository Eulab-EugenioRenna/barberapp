<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>alora — identità visiva</title>
  <style>
    @font-face { font-family: Inter; src: url("fonts/Inter-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: Inter; src: url("fonts/Inter-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: swap; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #0e0e0e; font-family: Inter, sans-serif; }
    main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; max-width: 1600px; margin: auto; }
    figure { margin: 0; }
    .panel { aspect-ratio: 1; display: grid; place-content: center; text-align: center; border-radius: 20px; }
    .app { background: #88bd39; }
    .app img { width: 128px; height: 128px; display: block; }
    .dark { background: #1e3425; color: #fff; }
    .corporate { background: #f4f8ec; color: #88bd39; }
    .name { font-weight: 600; font-size: 44px; letter-spacing: -.035em; line-height: 1.15; }
    .signature { font-size: 21px; font-weight: 400; color: #58635a; margin-top: 12px; letter-spacing: .025em; }
    figcaption { text-align: center; margin-top: 12px; color: #cdcdcd; font-size: 20px; }
    @media (max-width: 650px) { main { grid-template-columns: 1fr; } .panel { aspect-ratio: 1.3; } }
  </style>
</head>
<body>
  <main>
    <figure><div class="panel app"><img src="icons/app-icon.svg" alt="Simbolo alora estratto dal logo originale"></div><figcaption>App icon</figcaption></figure>
    <figure><div class="panel dark"><span class="name">alora</span></div><figcaption>Dark branding</figcaption></figure>
    <figure><div class="panel corporate"><div><div class="name">alora</div><div class="signature">by EULAB</div></div></div><figcaption>Corporate</figcaption></figure>
  </main>
</body>
</html>
