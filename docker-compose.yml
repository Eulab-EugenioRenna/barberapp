services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: barber
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: barber
    networks:
      app:
        aliases:
          - postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barber -d barber"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: api-runtime
    env_file: .env
    environment:
      DATABASE_URL: postgresql://barber:barber@postgres:5432/barber?schema=public
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_WAIT_ATTEMPTS: "60"
      DB_WAIT_SLEEP_SECONDS: "2"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      ADMIN_APP_URL: ${APP_ORIGIN:-http://127.0.0.1:53020}
      PUBLIC_APP_URL: ${APP_ORIGIN:-http://127.0.0.1:53020}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      app:
        aliases:
          - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    volumes:
      - uploads_data:/app/uploads

  web-admin:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: admin-runtime
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 6
    networks:
      - app
    restart: unless-stopped

  web-public-booking:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: booking-runtime
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 6
    networks:
      - app
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
      web-admin:
        condition: service_healthy
      web-public-booking:
        condition: service_healthy
    networks:
      - app
    ports:
      - "127.0.0.1:${ALORA_HTTP_PORT:-53020}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    networks:
      - app

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - app
    volumes:
      - redis_data:/data

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  api_node_modules:
  api_npm_cache:
  api_dist:
  web_admin_node_modules:
  web_admin_npm_cache:
  web_admin_angular_cache:
  web_admin_dist:
  web_public_node_modules:
  web_public_npm_cache:
  web_public_angular_cache:
  web_public_dist:
  uploads_data:
