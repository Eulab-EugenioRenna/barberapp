services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: barber
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: barber
    networks:
      app:
        aliases:
          - postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barber -d barber"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql://barber:barber@postgres:5432/barber?schema=public
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_WAIT_ATTEMPTS: "60"
      DB_WAIT_SLEEP_SECONDS: "2"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      ADMIN_APP_URL: ${APP_ORIGIN:-http://localhost:8080}
      PUBLIC_APP_URL: ${APP_ORIGIN:-http://localhost:8080}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      app:
        aliases:
          - api
    restart: unless-stopped
    command: >-
      sh -c "until nc -z postgres 5432; do sleep 2; done && npm run prisma:generate && npm run prisma:deploy && npm run seed:platform-demo && npm run serve:api"
    volumes:
      - .:/app
      - uploads_data:/app/uploads
      - api_node_modules:/app/node_modules
      - api_npm_cache:/root/.npm
      - api_dist:/app/dist

  web-admin:
    build:
      context: .
      dockerfile: docker/web-admin.Dockerfile
    depends_on:
      api:
        condition: service_started
    networks:
      - app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: npm run serve:admin
    volumes:
      - .:/app
      - web_admin_node_modules:/app/node_modules
      - web_admin_npm_cache:/root/.npm
      - web_admin_angular_cache:/app/.angular
      - web_admin_dist:/app/dist

  web-public-booking:
    build:
      context: .
      dockerfile: docker/web-public-booking.Dockerfile
    depends_on:
      api:
        condition: service_started
    networks:
      - app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: npm run serve:public
    volumes:
      - .:/app
      - web_public_node_modules:/app/node_modules
      - web_public_npm_cache:/root/.npm
      - web_public_angular_cache:/app/.angular
      - web_public_dist:/app/dist

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_started
      web-admin:
        condition: service_started
      web-public-booking:
        condition: service_started
    networks:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    networks:
      - app

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - app
    volumes:
      - redis_data:/data

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  api_node_modules:
  api_npm_cache:
  api_dist:
  web_admin_node_modules:
  web_admin_npm_cache:
  web_admin_angular_cache:
  web_admin_dist:
  web_public_node_modules:
  web_public_npm_cache:
  web_public_angular_cache:
  web_public_dist:
  uploads_data:
